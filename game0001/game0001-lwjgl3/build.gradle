buildscript {
  repositories {
    gradlePluginPortal()
  }
  dependencies {
    // 使用jpackage只有在JDK版本为14或更高时才有效。
    // 你的JAVA_HOME环境变量可能也需要指向版本为14或更高的JDK。
    if (JavaVersion.current().isCompatibleWith(JavaVersion.VERSION_14)) {
      classpath "org.beryx:badass-runtime-plugin:1.12.7"
    }
  }
}

apply plugin: "org.jetbrains.compose"

if (JavaVersion.current().isCompatibleWith(JavaVersion.VERSION_14)) {
  apply plugin: 'org.beryx.runtime'
}
else {
  apply plugin: 'application'
}

sourceSets.main.resources.srcDirs += [
  // rootProject.file('game0001/assets').path
  '../../assets',
  '../assets'
]
//mainClassName = 'pama1234.gdx.game.app.lwjgl3.Launcher'
eclipse.project.name = appName + '0001-lwjgl3'
sourceCompatibility = 21

dependencies {
  implementation "$gdxModule:gdx-backend-lwjgl3:$gdxVersion"
  // implementation "$gdxCustomModule:gdx-bullet-platform:$gdxCustomVersion:natives-desktop"
  implementation "$gdxModule:gdx-platform:$gdxVersion:natives-desktop"

  implementation "$pama1234RepoLocation:lwjgl-framework:$pama1234PublishVersion"
  implementation project(':game0001:game0001-core')

  // implementation "com.mazatech.amanithsvg:amanithsvg-gdx:$amanithsvgVersion:natives-desktop"

  // Compose for desktop
  implementation("org.jetbrains.compose.desktop:desktop:1.4.0") // 使用适合的Compose版本
}

compose.desktop {
  application {
    mainClass = "pama1234.gdx.game.app.lwjgl3.Launcher" // 你应用程序的入口类
  }
}

def os = System.properties['os.name'].toLowerCase()

run {
  // workingDir = [ '../assets' ]
  workingDir = rootProject.file('../assets').path
  // workingDir = rootProject.file('game0001/assets').path
  setIgnoreExitValue(true)

  if (os.contains('mac')) {
    // 在MacOS上运行LWJGL3 Java应用程序所需
    jvmArgs += "-XstartOnFirstThread"
  }
  // jvmArgs+="-Dcom.amd.aparapi.enableShowGeneratedOpenCL=true"//TODO
}

jar {
  // 将生成的.jar文件的名称设置为游戏或应用程序的名称。
  archiveBaseName.set(eclipse.project.name)
  // 使用'lib'而不是默认的'libs'似乎是jpackageimage所需要的。
  destinationDirectory = file("$project.buildDir/lib")
  // 从Gradle 7.0开始，duplicatesStrategy变得重要；这个设置是有效的。
  duplicatesStrategy(DuplicatesStrategy.EXCLUDE)
  dependsOn configurations.runtimeClasspath
  from {
    configurations.runtimeClasspath.collect {
      it.isDirectory() ? it : zipTree(it)
    }
  }
  // 这些"exclude"行删除了输出JAR中一些不必要的重复文件。
  exclude('META-INF/INDEX.LIST', 'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA')
  dependencies {
    exclude('META-INF/INDEX.LIST', 'META-INF/maven/**')
  }
  // 设置manifest使JAR可运行。
  manifest {
    attributes 'Main-Class': project.mainClassName
  }
  // 这最后一步可能有助于在一些需要额外指令来制作可运行JAR的操作系统上。
  doLast {
    file(archiveFile).setExecutable(true, false)
  }
}

distTar {duplicatesStrategy(DuplicatesStrategy.EXCLUDE)}
distZip {duplicatesStrategy(DuplicatesStrategy.EXCLUDE)}

if (JavaVersion.current().isCompatibleWith(JavaVersion.VERSION_14)) {
  jpackageImage.dependsOn jar

  runtime {
    options.set([
      '--strip-debug',
      '--compress',
      '2',
      '--no-header-files',
      '--no-man-pages',
      '--strip-native-commands',
      '--vm',
      'server'
    ])
    // 你可能需要比这个更多的模块。
    // 使用lwjgl3:suggestModules任务来查看可能需要哪些模块。
    modules.set(['jdk.unsupported'])
    distDir.set(file(buildDir))
    jpackage {
      imageName = appName
      // 如果你想构建安装程序，可以将此设置为false，或保持为true以仅构建应用程序。
      skipInstaller = true
      // 如果你的JAVA_HOME指向低版本JDK，可能需要将此设置为不同的路径。
      jpackageHome = javaHome.getOrElse("")
      mainJar = jar.archiveFileName.get()
      if (os.contains('win')) {
        imageOptions = ["--icon", "icons/logo.ico"]
      } else if (os.contains('nix') || os.contains('nux') || os.contains('bsd')) {
        imageOptions = ["--icon", "icons/logo.png"]
      } else if (os.contains('mac')) {
        imageOptions = [
          "--icon",
          "icons/logo.icns",
          " --java-options",
          "\"XstartOnFirstThread\""
        ]
      }
    }
  }
}

// 等同于jar任务；这里是为了与gdx-setup兼容。
task dist(dependsOn: [jar]) { }
