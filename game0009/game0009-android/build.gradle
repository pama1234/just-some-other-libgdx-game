apply plugin: 'com.android.application'

android {
  namespace 'hhs.game.diffjourney'
  compileSdk project.properties.compileSdkVersion.toInteger()
//  buildToolsVersion "34.0.0"
  signingConfigs {
    release {
      // storeFile file('sign.jks')
      // storePassword ''
      // keyAlias 'xxx'
      // keyPassword ''
    }
  }
  sourceSets {
    main {
      manifest.srcFile 'AndroidManifest.xml'
      java.srcDirs = ['src/main/java']
      aidl.srcDirs = ['src/main/java']
      renderscript.srcDirs = ['src/main/java']
      res.srcDirs = ['res']
      assets.srcDirs = ['../assets']
      jniLibs.srcDirs = ['libs']
    }
  }
  packagingOptions {
    resources {
      pickFirsts += ['**/*' , 'META-INF/LICENSE.txt' , 'META-INF/LICENSE' , 'META-INF/license.txt' , 'META-INF/LGPL2.1' , 'META-INF/NOTICE.txt' , 'META-INF/NOTICE' , 'META-INF/notice.txt']
      excludes += ['META-INF/robovm/ios/robovm.xml' , 'META-INF/DEPENDENCIES.txt' , 'META-INF/DEPENDENCIES' , 'META-INF/dependencies.txt' , 'README.md' , 'latestchanges.html' , 'changelog.txt' , 'AUTHORS']
    }
// exclude 'assets/image/src/*'
    // Preventing from license violations (more or less):
    // Excluding unnecessary meta-data:
  }
  defaultConfig {
    compileSdk project.properties.compileSdkVersion.toInteger()
    applicationId 'hhs.game.diffjourney'
    minSdkVersion project.properties.minSdkVersion.toInteger()
    targetSdkVersion project.properties.targetSdkVersion.toInteger()
    versionCode 1
    versionName "1.0"
    multiDexEnabled true
  }
  compileOptions {
    encoding = 'UTF-8'
    sourceCompatibility "21"
    targetCompatibility "21"
    coreLibraryDesugaringEnabled true
  }

  buildTypes {
    release {
      minifyEnabled true
      proguardFiles getDefaultProguardFile('proguard-android.txt') , 'proguard-rules.pro'
      signingConfig android.signingConfigs.release
    }
    debug {
      signingConfig android.signingConfigs.release
    }
  }
}
def Properties props = new Properties()
def propFile = new File(rootDir.getAbsoluteFile(),'/doc/signing/signing.properties')
if(propFile.canRead()) {
  props.load(new FileInputStream(propFile))

  if(props != null && props.containsKey('STORE_FILE') && props.containsKey('STORE_PASSWORD') &&
      props.containsKey('KEY_ALIAS') && props.containsKey('KEY_PASSWORD')) {

    android.signingConfigs.release.storeFile = file(props['STORE_FILE'])
    android.signingConfigs.release.storePassword = props['STORE_PASSWORD']
    android.signingConfigs.release.keyAlias = props['KEY_ALIAS']
    android.signingConfigs.release.keyPassword = props['KEY_PASSWORD']
  } else {
  
    android.buildTypes.release.signingConfig = null
  }
} else {
  android.buildTypes.release.signingConfig = null
}

repositories {
  // flatDir { dirs 'libs' }
  // needed for AAPT2, may be needed for other tools
  mavenCentral()
  google()
}

configurations { natives }

dependencies {
  coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:$androidDesugarVersion"

  implementation("$gdxModule:gdx-backend-android:$gdxVersion")
  implementation "$pama1234RepoLocation:server-framework:$pama1234PublishVersion"
  implementation("$pama1234RepoLocation:framework:$pama1234PublishVersion"){
    exclude group: "hhs.gdx.hslib", module: "*"
  }
  implementation "$pama1234RepoLocation:android-framework:$pama1234PublishVersion"
  
  implementation project(':game0009:game0009-core')
  implementation project(':game0009:game0009-server')

  implementation "com.github.simplepeng.SpiderMan:spiderman:$spidermanVersion"//如果程序异常闪退提供log

  // implementation "$gdxCustomModule:gdx:$gdxCustomVersion"
  natives "$gdxModule:gdx-platform:$gdxVersion:natives-armeabi-v7a"
  natives "$gdxModule:gdx-platform:$gdxVersion:natives-arm64-v8a"
  natives "$gdxModule:gdx-platform:$gdxVersion:natives-x86"
  natives "$gdxModule:gdx-platform:$gdxVersion:natives-x86_64"
  natives "$gdxModule:gdx-freetype-platform:$gdxVersion:natives-arm64-v8a"
}

// Called every time gradle gets executed, takes the native dependencies of
// the natives configuration, and extracts them to the proper libs/ folders
// so they get packed with the APK.
task copyAndroidNatives() {
  doFirst {
    file("libs/armeabi/").mkdirs()
    file("libs/armeabi-v7a/").mkdirs()
    file("libs/arm64-v8a/").mkdirs()
    file("libs/x86_64/").mkdirs()
    file("libs/x86/").mkdirs()

    configurations.getByName("natives").copy().files.each { jar ->
      def outputDir = null
      if(jar.name.endsWith("natives-arm64-v8a.jar")) outputDir = file("libs/arm64-v8a")
      if(jar.name.endsWith("natives-armeabi-v7a.jar")) outputDir = file("libs/armeabi-v7a")
      if(jar.name.endsWith("natives-armeabi.jar")) outputDir = file("libs/armeabi")
      if(jar.name.endsWith("natives-x86_64.jar")) outputDir = file("libs/x86_64")
      if(jar.name.endsWith("natives-x86.jar")) outputDir = file("libs/x86")
      if(outputDir != null) {
        copy {
          from zipTree(jar)
          into outputDir
          include "*.so"
        }
      }
    }
  }
}

tasks.whenTaskAdded { packageTask ->
  if(packageTask.name.contains("package")) {
    packageTask.dependsOn 'copyAndroidNatives'
  }
}

task run(type: Exec) {
  def path
  def localProperties = project.file("../local.properties")
  if(localProperties.exists()) {
    Properties properties = new Properties()
    localProperties.withInputStream { instr ->
      properties.load(instr)
    }
    def sdkDir = properties.getProperty('sdk.dir')
    if(sdkDir) {
      path = sdkDir
    } else {
      path = "$System.env.ANDROID_HOME"
    }
  } else {
    path = "$System.env.ANDROID_HOME"
  }

  def adb = path + "/platform-tools/adb"
  commandLine "$adb" , 'shell' , 'am' , 'start' , '-n' , 'hhs.game.diffjourney/hhs.game.diffjourney.AndroidLauncher'
}

eclipse.project.name = "DifferentJourney" + "-android"
