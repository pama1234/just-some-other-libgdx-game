buildscript {
  repositories {
    mavenCentral()
    google()
    maven { url 'https://s01.oss.sonatype.org' }
    maven { url 'https://maven.scijava.org/content/repositories/public/' }
    maven { url 'https://jitpack.io' }
    mavenLocal()
    gradlePluginPortal()
    maven { url 'https://oss.sonatype.org/content/repositories/snapshots/' }
    maven { url 'https://s01.oss.sonatype.org/content/repositories/snapshots/' }
  }
  dependencies {
    classpath 'com.android.tools.build:gradle:8.5.2'
    classpath "com.diffplug.spotless:spotless-plugin-gradle:$spotlessPluginVersion"
    classpath "com.google.protobuf:protobuf-gradle-plugin:$protobufGradleVersion"
    classpath "com.github.johnrengelman.shadow:com.github.johnrengelman.shadow.gradle.plugin:$shadowPluginVersion"
    classpath "io.freefair.gradle:lombok-plugin:$lombokPluginVersion"

    classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlinVersion"
    classpath "org.jetbrains.compose:compose-gradle-plugin:$composeVersion"
    classpath("org.jetbrains.kotlin:compose-compiler-gradle-plugin:$composeVersion")
    classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlinVersion")

    // This follows advice from https://blog.gradle.org/log4j-vulnerability
    constraints {
      classpath("org.apache.logging.log4j:log4j-core") {
        version {
          strictly("[2.17, 3[")
          prefer("2.22.1")
        }
        because("CVE-2021-44228, CVE-2021-45046, CVE-2021-45105: Log4j vulnerable to remote code execution and other critical security vulnerabilities")
      }
    }
  }
}

plugins {
  id "com.diffplug.spotless" version "$spotlessPluginVersion"
  id "org.openrewrite.rewrite" version "6.4.0"

  // id 'idea'
  // id 'eclipse'
}

repositories {
  // 和publishToMavenLocal配套使用，用于替代jitpack进行纯本地新版本测试
  mavenLocal()

  maven { url 'https://maven.google.com/public' }
  maven { url 'https://maven.google.com/google' }
  // maven { url 'https://maven.aliyun.com/repository/public' }
  // maven { url 'https://maven.aliyun.com/repository/google' }
  mavenCentral()
  // maven { url '	https://repo1.maven.org/maven2/' }
  maven { url 'https://s01.oss.sonatype.org' }
  gradlePluginPortal()
  maven { url 'https://oss.sonatype.org/content/repositories/snapshots/' }
  maven { url 'https://s01.oss.sonatype.org/content/repositories/snapshots/' }
  maven { url 'https://maven.scijava.org/content/repositories/public/' }
  maven { url 'https://jitpack.io' }
  maven { url 'https://jogamp.org/deployment/maven/' }
}

spotless {
  lineEndings 'UNIX'

  java {
    target '**/*.java'
    removeUnusedImports()
    eclipse().configFile new File(rootProject.projectDir.absolutePath, 'doc/eclipse.formatter.xml')
  }
  groovyGradle {
    target '*.gradle'
    greclipse().configFile new File(rootProject.projectDir.absolutePath, 'doc/eclipse.formatter.xml')
  }
}

allprojects{
}

// 过滤所有Java性质的子项目，排除指定的项目
configure(subprojects.findAll { subproject ->
  // 定义一个正则表达式模式，用于匹配要排除的项目名称
  def excludedPattern = ~/^(games-collection|framework0005-net-android|taptap-framework|game\d{4}(-(android|pico4|taptap|cgj))?)$/

  // 如果项目名称不匹配排除的模式，则返回true
  !subproject.name.matches(excludedPattern)
}) {
  // 应用Java插件
  apply plugin: "java"
  apply plugin: 'java-library'

  // 设置Java的源码兼容性版本为17
  sourceCompatibility = 21

  compileJava {
    // 启用增量编译
    options.incremental = true
    // 设置编译的字符编码为UTF-8
    options.encoding = 'UTF-8'
  }

  dependencies {
  }
}


// 配置所有的Java性质和Android性质项目，排除特定项目
configure(subprojects.findAll { project ->
  // 使用正则表达式匹配项目名称
  // 排除framework0001-framework0005和game0001-game0011
  !project.name.matches(/^(framework000[1-5]|game00[0-1][1-9]?)$/)
}) {
  // 应用IDE相关插件
  apply plugin: 'idea'
  apply plugin: 'eclipse'

  // 应用Shadow插件，用于创建fat JAR
  apply plugin: "com.github.johnrengelman.shadow"
  // 应用Lombok插件，简化Java代码
  apply plugin: "io.freefair.lombok"

  // 设置项目版本
  version = '0.0.1'
  // 设置应用名称
  ext.appName = 'game'

  // 配置项目仓库
  repositories {
    // Google的Maven仓库
    maven { url 'https://maven.google.com/public' }
    maven { url 'https://maven.google.com/google' }

    // 中央Maven仓库
    mavenCentral()

    // Sonatype的OSS仓库
    maven { url 'https://s01.oss.sonatype.org' }

    // 本地Maven仓库
    mavenLocal()

    // Gradle插件门户
    gradlePluginPortal()

    // Sonatype的快照仓库
    maven { url 'https://oss.sonatype.org/content/repositories/snapshots/' }
    maven { url 'https://s01.oss.sonatype.org/content/repositories/snapshots/' }

    // 其他特定的Maven仓库
    maven { url 'https://maven.scijava.org/content/repositories/public/' }
    maven { url 'https://jitpack.io' }
    maven { url 'https://jogamp.org/deployment/maven/' }
  }
}